name: Broad-universe backtest

# Research only (docs/backtest-brief.md). Yahoo is reachable from CI runners, so the
# backtest runs here and commits its tables and CSVs back to the branch that ran it.
# Manual, plus a run when the script or this file changes on a branch other than main.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/backtest-broad-universe.yml
      - scripts/backtest_broad_universe.py

permissions:
  contents: write

concurrency:
  group: backtest-broad-universe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned so a re-run computes the same thing.
      - run: pip install --quiet yfinance==1.7.0 pandas==3.1.0 numpy==2.5.4

      - name: Run backtest
        shell: bash
        run: python -W ignore scripts/backtest_broad_universe.py 2>&1 | tee backtest-log.txt

      # The per-signal file is about 20 MB, too large to keep in the repository, so it is
      # attached to the run instead of committed.
      - name: Attach per-signal results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-broad-universe-signals
          path: docs/backtest-broad-universe-signals.csv.gz
          retention-days: 90

      - name: Commit results
        run: |
          mkdir -p docs
          mv backtest-log.txt docs/backtest-broad-universe-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backtest-broad-universe-*.csv \
                  docs/backtest-broad-universe-tables.md docs/backtest-broad-universe-results.json \
                  docs/backtest-broad-universe-log.txt docs/backtest-narrow-replication-signals.csv
          if git diff --staged --quiet; then
            echo "results unchanged"
          else
            git commit -m "Broad-universe backtest results [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
